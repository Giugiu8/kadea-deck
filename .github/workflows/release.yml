name: Release
# Official releases come only from this workflow. Actions are pinned to full commit SHAs.
on:
  push:
    tags:
      - 'v*'
permissions: {}
jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: read
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache: a release must not inherit state from other workflow runs.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Tag must match package version
        id: package
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:TAG -notmatch ('^v' + [regex]::Escape($version) + '(-[0-9A-Za-z.]+)?$')) { throw "Tag $env:TAG does not match package version $version" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - run: npm ci --ignore-scripts
      - name: ImageMagick for key images
        shell: pwsh
        run: |
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
            choco install imagemagick --yes --no-progress
            $location = (Get-ChildItem 'C:/Program Files/ImageMagick-*' -Directory | Select-Object -First 1).FullName
            $location | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Build, test, validate, verify and write SBOM
        run: node release.mjs
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          if-no-files-found: error
          path: |
            release/Cardea-Deck-*.streamDeckPlugin
            release/Cardea-Deck-*-advanced-portable.zip
            release/Remove-Claude-Hooks.ps1
            release/SHA256SUMS.txt
            release/Cardea-Deck-*.cdx.json

  # A second, independent rebuild on another operating system must produce the same code.
  reproduce:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files
      - name: Compare the release files with this rebuild
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          printf '%s\n' "Cardea-Deck-$VERSION-advanced-portable.zip" "Cardea-Deck-$VERSION.cdx.json" "Cardea-Deck-$VERSION.streamDeckPlugin" Remove-Claude-Hooks.ps1 SHA256SUMS.txt | LC_ALL=C sort > expected-files.txt
          ls -A release-files | LC_ALL=C sort | diff expected-files.txt -
          (cd release-files && sha256sum -c SHA256SUMS.txt)
          node reproduce.mjs "release-files/Cardea-Deck-$VERSION.streamDeckPlugin"
          node reproduce.mjs "release-files/Cardea-Deck-$VERSION-advanced-portable.zip"
          node reproduce.mjs release-files/Remove-Claude-Hooks.ps1
          node reproduce.mjs "release-files/Cardea-Deck-$VERSION.cdx.json"

  # Signing rights never meet code from the repository or a package manager: this job only attests files.
  attest:
    needs: [build, reproduce]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files
      - name: Provenance for every release file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-files/*
      - name: Attach the SBOM to the plugin
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: release-files/Cardea-Deck-*.streamDeckPlugin
          sbom-path: release-files/Cardea-Deck-${{ needs.build.outputs.version }}.cdx.json

  publish:
    needs: [build, reproduce, attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release create "$TAG" release-files/* --repo "$REPOSITORY" --verify-tag --prerelease --title "Cardea Deck $TAG" --notes "Built by GitHub Actions from this tag. Verification: docs/REPRODUCE.md"
