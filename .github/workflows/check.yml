name: Windows build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: ImageMagick for source builds
        shell: pwsh
        run: |
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
            choco install imagemagick --yes --no-progress
            $location = (Get-ChildItem 'C:/Program Files/ImageMagick-*' -Directory | Select-Object -First 1).FullName
            $location | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Build, test, validate and verify installable artifacts
        run: node release.mjs
      - run: npm audit --omit=dev --audit-level=high
